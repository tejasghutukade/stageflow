name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Stageflow to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
