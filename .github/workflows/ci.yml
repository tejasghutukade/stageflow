name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run ui:build

      - run: npm test

      - run: npm run ui:test

      - run: npm run typecheck
