name: Archify PR diagrams

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to diagram (resolves head/base; enables sticky comment)"
        required: false
        type: string
      head_ref:
        description: "Branch or commit SHA when not using pr_number"
        required: false
        type: string
      base_ref:
        description: "Base branch for the three-dot diff"
        required: false
        type: string
        default: main

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  diagram:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - id: target
        name: Resolve target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.head_ref }}
          INPUT_BASE: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          BASE_REF="${INPUT_BASE:-main}"
          PR_NUMBER=""
          HEAD_REF=""
          HEAD_SHA=""

          if [ -n "${INPUT_PR}" ]; then
            PR_JSON="$(gh pr view "${INPUT_PR}" --repo "${{ github.repository }}" \
              --json number,headRefName,baseRefName,headRefOid)"
            PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
            HEAD_REF="$(jq -r '.headRefName' <<<"$PR_JSON")"
            BASE_REF="$(jq -r '.baseRefName' <<<"$PR_JSON")"
            HEAD_SHA="$(jq -r '.headRefOid' <<<"$PR_JSON")"
          elif [ -n "${INPUT_HEAD}" ]; then
            HEAD_REF="${INPUT_HEAD}"
            HEAD_SHA="${INPUT_HEAD}"
          else
            echo "Provide pr_number or head_ref." >&2
            exit 1
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "head_ref=${HEAD_REF}"
            echo "base_ref=${BASE_REF}"
            echo "head_sha=${HEAD_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ steps.target.outputs.base_ref }}"

      - name: Resolve commit SHA
        id: sha
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Prepare CI context
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ steps.target.outputs.base_ref }}
          GITHUB_HEAD_REF: ${{ steps.target.outputs.head_ref }}
        run: ./scripts/prepare-ci-context.sh ci-context.json

      - id: relevance
        name: Check diagram-relevant changes
        run: |
          set -euo pipefail
          COUNT="$(jq '.relevant_files | length' ci-context.json)"
          echo "relevant_count=${COUNT}" >> "${GITHUB_OUTPUT}"
          if [ "${COUNT}" = "0" ]; then
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            echo "No diagram-relevant paths in diff (docs/md/lockfiles/tests noise filtered)."
          else
            echo "skipped=false" >> "${GITHUB_OUTPUT}"
            jq -r '.relevant_files[]' ci-context.json
          fi

      - uses: actions/setup-node@v4
        if: steps.relevance.outputs.skipped != 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Build Stageflow CLI
        if: steps.relevance.outputs.skipped != 'true'
        run: npm ci && npm run build

      - name: Install Archify skill
        if: steps.relevance.outputs.skipped != 'true'
        env:
          ARCHIFY_SOURCE_DIR: ${{ secrets.ARCHIFY_SOURCE_DIR }}
          ARCHIFY_ZIP_URL: ${{ vars.ARCHIFY_ZIP_URL }}
        run: |
          set -e
          if [ -n "${ARCHIFY_SOURCE_DIR}" ]; then
            node dist/cli.js skills install --from-path "${ARCHIFY_SOURCE_DIR}" --skill-name archify
          else
            ZIP_URL="${ARCHIFY_ZIP_URL:-https://github.com/tt-a1i/archify/releases/download/v2.15.0/archify.zip}"
            node dist/cli.js skills install --from-zip "${ZIP_URL}" --skill-name archify
          fi

      - name: Require OPENROUTER_API_KEY
        if: steps.relevance.outputs.skipped != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is empty. Add it as a repository Actions secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Validate pipeline catalog
        if: steps.relevance.outputs.skipped != 'true'
        run: node dist/cli.js validate --strict --json

      - name: Provider login
        if: steps.relevance.outputs.skipped != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node dist/cli.js providers login openrouter --type api_key --api-key-env OPENROUTER_API_KEY

      - name: Cap OpenRouter maxTokens
        if: steps.relevance.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          # OpenRouter credits-check reserves the full max_tokens budget. Minimax
          # advertises ~512k, which 402s on small balances. Cap for CI stages.
          MODELS_JSON='{"providers":{"openrouter":{"modelOverrides":{"minimax/minimax-m3":{"contextWindow":131072,"maxTokens":8192}}}}}'
          for dir in "${HOME}/.stageflow/agent" "${HOME}/.pi/agent"; do
            mkdir -p "${dir}"
            printf '%s\n' "${MODELS_JSON}" > "${dir}/models.json"
            echo "wrote ${dir}/models.json"
          done

      - id: envelope
        name: Run Archify-on-PR pipeline
        if: steps.relevance.outputs.skipped != 'true'
        uses: ./.github/actions/sf-run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ steps.target.outputs.base_ref }}
          GITHUB_HEAD_REF: ${{ steps.target.outputs.head_ref }}
        with:
          pipeline: examples/archify-on-pr/archify-on-pr.pipeline.yaml
          task: examples/archify-on-pr/archify-on-pr.task.yaml
          checkout: ${{ github.workspace }}
          extra-args: >-
            --skip-gates
            --git-sha ${{ steps.sha.outputs.head_sha }}
            --ci-job-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          detect-stage: detect-changes
          stage: author-diagrams
          export-run: "true"

      - id: skip-merge
        name: Resolve skip state
        run: |
          set -euo pipefail
          ARTIFACT_TAG="sha-${{ steps.sha.outputs.head_sha }}"
          if [ -n "${{ steps.target.outputs.pr_number }}" ]; then
            ARTIFACT_TAG="pr-${{ steps.target.outputs.pr_number }}"
          fi
          echo "artifact_tag=${ARTIFACT_TAG}" >> "${GITHUB_OUTPUT}"
          if [ "${{ steps.relevance.outputs.skipped }}" = "true" ]; then
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
          elif [ "${{ steps.envelope.outputs.skipped }}" = "true" ]; then
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skipped=false" >> "${GITHUB_OUTPUT}"
          fi

      - id: deliver
        name: Deliver diagram HTML
        if: steps.skip-merge.outputs.skipped != 'true'
        env:
          CI_CONTEXT_FILE: ci-context.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: ./scripts/deliver-diagrams.sh "${{ steps.envelope.outputs.envelope-path }}" diagrams

      - id: upload-architecture
        name: Upload architecture.html
        if: steps.skip-merge.outputs.skipped != 'true' && hashFiles('diagrams/architecture.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: diagrams/architecture.html
          archive: false
          retention-days: 30

      - id: upload-workflow
        name: Upload workflow.html
        if: steps.skip-merge.outputs.skipped != 'true' && hashFiles('diagrams/workflow.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: diagrams/workflow.html
          archive: false
          retention-days: 30

      - id: upload-sequence
        name: Upload sequence.html
        if: steps.skip-merge.outputs.skipped != 'true' && hashFiles('diagrams/sequence.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: diagrams/sequence.html
          archive: false
          retention-days: 30

      - id: upload-dataflow
        name: Upload dataflow.html
        if: steps.skip-merge.outputs.skipped != 'true' && hashFiles('diagrams/dataflow.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: diagrams/dataflow.html
          archive: false
          retention-days: 30

      - id: upload-lifecycle
        name: Upload lifecycle.html
        if: steps.skip-merge.outputs.skipped != 'true' && hashFiles('diagrams/lifecycle.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: diagrams/lifecycle.html
          archive: false
          retention-days: 30

      - id: upload-diagrams-bundle
        name: Upload diagram bundle (zip)
        if: steps.skip-merge.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: archify-diagrams-${{ steps.skip-merge.outputs.artifact_tag }}
          path: diagrams/
          retention-days: 30

      - name: Build PR comment
        if: steps.skip-merge.outputs.skipped != 'true' && steps.target.outputs.pr_number != ''
        env:
          URL_ARCHITECTURE: ${{ steps.upload-architecture.outputs.artifact-url }}
          URL_WORKFLOW: ${{ steps.upload-workflow.outputs.artifact-url }}
          URL_SEQUENCE: ${{ steps.upload-sequence.outputs.artifact-url }}
          URL_DATAFLOW: ${{ steps.upload-dataflow.outputs.artifact-url }}
          URL_LIFECYCLE: ${{ steps.upload-lifecycle.outputs.artifact-url }}
          BUNDLE_URL: ${{ steps.upload-diagrams-bundle.outputs.artifact-url }}
        run: |
          set -e
          HEAD_SHA="${{ steps.sha.outputs.head_sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          artifact_url_for_type() {
            case "$1" in
              architecture) echo "${URL_ARCHITECTURE}" ;;
              workflow) echo "${URL_WORKFLOW}" ;;
              sequence) echo "${URL_SEQUENCE}" ;;
              dataflow) echo "${URL_DATAFLOW}" ;;
              lifecycle) echo "${URL_LIFECYCLE}" ;;
              *) echo "" ;;
            esac
          }

          {
            echo "## Diagrams (Archify)"
            echo ""
            echo "Updated for \`${SHORT_SHA}\`."
            echo ""
            echo "| Type | Summary | View |"
            echo "|---|---|---|"
            while IFS= read -r diagram; do
              TYPE="$(echo "$diagram" | jq -r '.diagram_type')"
              SUMMARY="$(echo "$diagram" | jq -r '.summary')"
              URL="$(artifact_url_for_type "$TYPE")"
              if [ -n "$URL" ]; then
                VIEW="[open in browser](${URL})"
              else
                VIEW="—"
              fi
              echo "| ${TYPE} | ${SUMMARY} | ${VIEW} |"
            done < <(jq -c '.diagrams[]' "${{ steps.envelope.outputs.envelope-path }}")
            echo ""
            echo "| | | |"
            echo "|---|---|---|"
            if [ -n "${BUNDLE_URL}" ]; then
              echo "| Download all | ZIP bundle | [download](${BUNDLE_URL}) |"
            fi
            echo "| Workflow | run ${{ github.run_number }} | [logs](${RUN_URL}) |"
            echo ""
            echo "> View links open HTML in your browser (GitHub login required). Artifacts retained 30 days."
          } > comment.md

      - name: Post sticky PR comment
        if: steps.skip-merge.outputs.skipped != 'true' && steps.target.outputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: archify-diagram
          number: ${{ steps.target.outputs.pr_number }}
          path: comment.md

      - name: Upload Stageflow run workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stageflow-archify-${{ steps.skip-merge.outputs.artifact_tag }}-${{ github.run_number }}
          include-hidden-files: true
          path: |
            sf-run.json
            ci-context.json
            envelope.json
            run-export.json
            deliver-receipts.json
            diagrams/
            comment.md
            .stageflow/state.db
            .stageflow/state.db-wal
            .stageflow/state.db-shm
            .stageflow/runs/
            !.stageflow/runs/**/.pi-agent/**
          if-no-files-found: warn
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Archify diagrams"
            echo ""
            echo "- Target: \`${{ steps.target.outputs.head_ref }}\` @ \`${{ steps.sha.outputs.head_sha }}\`"
            echo "- Base: \`${{ steps.target.outputs.base_ref }}\`"
            if [ -n "${{ steps.target.outputs.pr_number }}" ]; then
              echo "- PR: #${{ steps.target.outputs.pr_number }}"
            fi
            echo ""
            if [ "${{ steps.relevance.outputs.skipped }}" = "true" ]; then
              echo "**Status:** skipped — no diagram-relevant paths after filtering docs/md/lockfiles/tests noise."
            elif [ "${{ steps.envelope.outcome }}" != "success" ] && [ "${{ steps.relevance.outputs.skipped }}" != "true" ]; then
              echo "**Status:** Stageflow pipeline did not complete."
            elif [ "${{ steps.envelope.outputs.skipped }}" = "true" ]; then
              echo "**Status:** skipped — detect-changes selected no diagram types."
            elif [ -f deliver-receipts.json ]; then
              COUNT="$(jq 'length' deliver-receipts.json)"
              echo "**Status:** deliver succeeded for ${COUNT} diagram(s)."
              echo ""
              echo '```json'
              cat deliver-receipts.json
              echo '```'
            else
              echo "**Status:** deliver did not complete."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
