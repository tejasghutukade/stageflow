name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Detect unpublished package.json version
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ ! "${CURRENT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${CURRENT}'; expected x.y.z" >&2
            exit 1
          fi
          echo "version=${CURRENT}" >> "${GITHUB_OUTPUT}"
          if npm view "stageflow@${CURRENT}" version >/dev/null 2>&1; then
            echo "stageflow@${CURRENT} is already on npm; skip"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "stageflow@${CURRENT} is not on npm; publish"
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci

      - if: steps.gate.outputs.publish == 'true'
        run: npm run build && npm run ui:build

      - if: steps.gate.outputs.publish == 'true'
        run: npm run verify:pack

      - if: steps.gate.outputs.publish == 'true'
        run: npm publish --provenance --access public

  github-release:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.publish.outputs.version }}
