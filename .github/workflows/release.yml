name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "stageflow version to install from npm (default: package.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: gate
        name: Detect unpublished GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="${{ inputs.version }}"
          if [ -z "${CURRENT}" ]; then
            CURRENT="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "${CURRENT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${CURRENT}'; expected x.y.z" >&2
            exit 1
          fi
          TAG="v${CURRENT}"
          PREVIOUS=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            PREVIOUS="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          fi
          echo "current=${CURRENT} previous=${PREVIOUS} tag=${TAG}"
          {
            echo "version=${CURRENT}"
            echo "tag=${TAG}"
            echo "previous=${PREVIOUS}"
          } >> "${GITHUB_OUTPUT}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skip"
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Stageflow should draft notes and publish ${TAG} using stageflow@${CURRENT} from npm"
          echo "release=true" >> "${GITHUB_OUTPUT}"

      - name: Require OPENAI_API_KEY
        if: steps.gate.outputs.release == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is empty. Add it as a repository Actions secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.release == 'true'
        with:
          node-version: "24"

      - name: Install Stageflow from npm
        if: steps.gate.outputs.release == 'true'
        run: |
          VERSION="${{ steps.gate.outputs.version }}"
          ok=0
          for i in $(seq 1 24); do
            if npm i -g "stageflow@${VERSION}"; then
              ok=1
              break
            fi
            echo "waiting for npm (${i}/24)"
            sleep 10
          done
          if [ "${ok}" != 1 ]; then
            echo "failed to install stageflow@${VERSION} from npm" >&2
            exit 1
          fi
          INSTALLED="$(node -p "require(require('child_process').execSync('npm root -g',{encoding:'utf8'}).trim() + '/stageflow/package.json').version")"
          echo "installed stageflow@${INSTALLED}"
          if [ "${INSTALLED}" != "${VERSION}" ]; then
            echo "expected stageflow@${VERSION}" >&2
            exit 1
          fi
          command -v sf

      - name: Generate notes and publish GitHub Release via Stageflow
        if: steps.gate.outputs.release == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_TAG: ${{ steps.gate.outputs.tag }}
          RELEASE_PREVIOUS: ${{ steps.gate.outputs.previous }}
        run: |
          sf providers login openai --type api_key --api-key-env OPENAI_API_KEY
          sf validate --strict --json
          set +e
          sf run \
            --pipeline examples/github-release/github-release.pipeline.yaml \
            --task examples/github-release/github-release.task.yaml \
            --checkout "$GITHUB_WORKSPACE" \
            --json --skip-gates \
            --git-sha "$GITHUB_SHA" \
            --ci-job-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$GITHUB_WORKSPACE/sf-run.json"
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/sf-run.json"
          exit $status

      - name: Upload Stageflow run workspace
        if: ${{ always() && steps.gate.outputs.release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: stageflow-github-release-${{ steps.gate.outputs.tag }}
          include-hidden-files: true
          path: |
            sf-run.json
            .stageflow/state.db
            .stageflow/state.db-wal
            .stageflow/state.db-shm
            .stageflow/runs/
            !.stageflow/runs/**/.pi-agent/**
          if-no-files-found: warn
          retention-days: 30
