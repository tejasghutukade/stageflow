name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: gate
        name: Detect package.json version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ ! "${CURRENT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${CURRENT}'; expected x.y.z" >&2
            exit 1
          fi
          TAG="v${CURRENT}"
          PREVIOUS=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            PREVIOUS="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          fi
          echo "current=${CURRENT} previous=${PREVIOUS} tag=${TAG}"
          {
            echo "version=${CURRENT}"
            echo "tag=${TAG}"
            echo "previous=${PREVIOUS}"
          } >> "${GITHUB_OUTPUT}"
          if [[ -n "${PREVIOUS}" && "${CURRENT}" == "${PREVIOUS}" ]]; then
            echo "Version did not change (${CURRENT}); skip"
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -n "${PREVIOUS}" ]]; then
            if ! node -e '
              const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
              for (let i = 0; i < 3; i++) {
                if ((a[i] ?? 0) > (b[i] ?? 0)) process.exit(0);
                if ((a[i] ?? 0) < (b[i] ?? 0)) process.exit(1);
              }
              process.exit(1);
            ' "${CURRENT}" "${PREVIOUS}"; then
              echo "Version ${CURRENT} is not greater than ${PREVIOUS}; skip"
              echo "release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skip"
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Version bumped; Stageflow should draft notes and publish ${TAG}"
          echo "release=true" >> "${GITHUB_OUTPUT}"

      - name: Require OPENAI_API_KEY
        if: steps.gate.outputs.release == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is empty. Add it as a repository Actions secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.release == 'true'
        with:
          node-version: "24"

      - name: Build and install Stageflow from this checkout
        if: steps.gate.outputs.release == 'true'
        run: |
          npm ci
          npm run build
          npm pack
          npm i -g ./stageflow-*.tgz
          command -v sf

      - name: Generate notes and publish GitHub Release via Stageflow
        if: steps.gate.outputs.release == 'true'
        working-directory: examples/github-release
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_TAG: ${{ steps.gate.outputs.tag }}
          RELEASE_PREVIOUS: ${{ steps.gate.outputs.previous }}
        run: |
          sf providers login openai --type api_key --api-key-env OPENAI_API_KEY
          sf validate --strict --json
          set +e
          sf run --task tasks/github-release.yaml --pipeline github-release --checkout "$GITHUB_WORKSPACE" --json --skip-gates --git-sha "$GITHUB_SHA" --ci-job-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$GITHUB_WORKSPACE/sf-run.json"
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/sf-run.json"
          exit $status

      - name: Upload Stageflow run workspace
        if: ${{ always() && steps.gate.outputs.release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: stageflow-github-release-${{ steps.gate.outputs.tag }}
          include-hidden-files: true
          path: |
            sf-run.json
            examples/github-release/.stageflow/state.db
            examples/github-release/.stageflow/state.db-wal
            examples/github-release/.stageflow/state.db-shm
            examples/github-release/.stageflow/runs/
            !examples/github-release/.stageflow/runs/**/.pi-agent/**
          if-no-files-found: warn
          retention-days: 30
