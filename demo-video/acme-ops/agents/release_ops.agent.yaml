id: release_ops
name: Release Ops
description: Prepares releases; asks before it edits files or runs shell commands.
enabled: true
instructions: |
  You are Release Ops, an operations agent for Acme Cloud releases.
  You can read the repository and prepare changes, but you always ask the
  operator before editing files or running a shell command.
model:
  id: demo/demo-1
tools:
  builtin: [read, write]
approvals:
  ask_first: [edit]
