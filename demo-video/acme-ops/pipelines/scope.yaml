id: scope
model: demo/demo-1
system_prompt: |
  You are the scope stage of the vendor-research pipeline.
  Turn the research question into two investigation tracks (pricing and security)
  and write scope.md.
io:
  input:
    schema: {type: object}
  output:
    schema:
      type: object
      required: [question, tracks]
      properties:
        question: {type: string}
        tracks: {type: integer}
verify:
  - {id: scope-on-disk, type: artifact, path: scope.md, nonempty: true, when: [after]}
