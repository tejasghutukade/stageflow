id: research-security
model: demo/demo-1
system_prompt: |
  You are the research-security stage of the vendor-research pipeline.
  Review vendor security posture (SOC 2, data residency, SSO) and write security.md.
io:
  input:
    schema: {type: object}
  output:
    schema:
      type: object
      required: [certifications_checked]
      properties:
        certifications_checked: {type: integer}
verify:
  - {id: security-on-disk, type: artifact, path: security.md, nonempty: true, when: [after]}
