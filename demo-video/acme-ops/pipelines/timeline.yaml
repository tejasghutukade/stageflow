id: timeline
model: demo/demo-1
system_prompt: |
  You are the timeline stage of the incident-postmortem pipeline.
  Reconstruct the minute-by-minute timeline from logs and alerts, write timeline.md.
io:
  input:
    schema: {type: object}
  output:
    schema:
      type: object
      required: [events]
      properties:
        events: {type: integer}
verify:
  - {id: timeline-on-disk, type: artifact, path: timeline.md, nonempty: true, when: [after]}
