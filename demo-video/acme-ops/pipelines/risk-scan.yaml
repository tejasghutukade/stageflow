id: risk-scan
model: demo/demo-1
system_prompt: |
  You are the risk-scan stage of the release-notes pipeline.
  In parallel with drafting, scan the breaking changes and flag anything that
  needs a migration note. Write risks.md and emit a risk level.
io:
  input:
    schema: {type: object}
  output:
    schema:
      type: object
      required: [risk_level, migration_notes]
      properties:
        risk_level: {type: string, enum: [low, medium, high]}
        migration_notes: {type: integer}
verify:
  - {id: risks-on-disk, type: artifact, path: risks.md, nonempty: true, when: [after]}
