id: research-pricing
model: demo/demo-1
system_prompt: |
  You are the research-pricing stage of the vendor-research pipeline.
  Compare vendor pricing for the question in scope.md and write pricing.md.
io:
  input:
    schema: {type: object}
  output:
    schema:
      type: object
      required: [vendors_compared]
      properties:
        vendors_compared: {type: integer}
verify:
  - {id: pricing-on-disk, type: artifact, path: pricing.md, nonempty: true, when: [after]}
