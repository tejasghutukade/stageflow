id: implement
system_prompt: |
  Take the prior stage envelope and produce the concrete deliverable described
  there. Prefer what already worked in the source session.

  When finished, call emit_stage_envelope once with status, summary, artifacts,
  and a payload describing what you produced. Your last tool call in this
  attempt must be emit_stage_envelope. An empty final message is a stage failure.
io:
  input:
    schema:
      type: object
      required:
        - known
        - unknown
      properties:
        known:
          type: array
          items:
            type: string
        unknown:
          type: array
          items:
            type: string
  output:
    schema:
      type: object
      required:
        - changed_files
      properties:
        changed_files:
          type: array
          items:
            type: string
