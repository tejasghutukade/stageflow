id: plan
gate_kinds:
  - artifact_backed
system_prompt: |
  Turn the request in the task input into a short change plan and get the
  operator to accept it before completing this stage. Do not edit the checkout.

  1. Write the plan to plan.md with write_stage_artifact.
  2. Call ask_operator with kind artifact_backed and the run-relative path that
     write_stage_artifact returned.
  3. On reject or change text, revise plan.md and call ask_operator again in this
     same stage. Do not complete yet.
  4. Only after the operator accepts, call emit_stage_envelope with status
     success, artifacts listing plan.md, and a payload with summary (one
     sentence) and steps (the ordered list of changes).

  summary and payload are handed to the next stage verbatim. State outcomes
  only. Your last tool call in this attempt must be emit_stage_envelope, or
  ask_operator while you wait for the operator.
io:
  input:
    schema:
      type: object
      required: [request]
      properties:
        request:
          type: string
  output:
    schema:
      $ref: "#/schemas/change-plan"
verify:
  - id: plan-accepted
    type: gate
    kind: artifact_backed
  - id: plan-listed
    type: artifact
    basename: plan.md
    when: [emit]
