id: implement
timeout_ms: 5400000
system_prompt: |
  Make the changes in the accepted plan (payload.steps) in the checkout. If the
  Feedback Loop Context block is present, fix every blocking finding it carries
  first.

  Success requires real checkout edits. Put every checkout-relative path you
  changed in payload.changed_files. Do not run the project's test command
  yourself as proof; Stageflow runs it after you emit.

  When finished, call emit_stage_envelope once with status, summary, artifacts
  (may be empty), and a payload with changed_files. Your last tool call in this
  attempt must be emit_stage_envelope.
io:
  input:
    schema:
      $ref: "#/schemas/change-plan"
  output:
    schema:
      type: object
      required: [changed_files]
      properties:
        changed_files:
          type: array
          items:
            type: string
verify:
  - id: checkout-changed
    type: checkout_changes
    path_fields: [changed_files]
  - id: tests
    type: command
    run: npm test
    timeout_ms: 900000
