id: run-tests
system_prompt: |
  Assess whether the current work is ready to ship.

  Write the results via write_stage_artifact (for example results.md).

  When you can assess readiness, emit a success envelope. Set payload.ready to
  true or false. Do not emit a failure status to express unreadiness.

  When finished, call emit_stage_envelope exactly once with status, summary,
  artifacts, and a payload the next stage can use.
io:
  input:
    schema:
      type: object
  output:
    schema:
      type: object
      required:
        - ready
      properties:
        ready:
          type: boolean
