version: 1
id: handbook-helper-simulated
name: Handbook helper, simulated users
description: A model plays the user. Costs more than the scripted eval; a judge decides whether each goal was reached.
type: capability
target:
  kind: agent
  agent: handbook_helper
dataset: ../datasets/handbook-helper-simulated.dataset.jsonl
defaults:
  repeats: 3
  # Replace with ids from `sf providers status`. Do not use the same id for the judge and the simulator.
  judge: anthropic/claude-sonnet-4-5
  judge_settings:
    temperature: 0
  user_model: anthropic/claude-sonnet-4-5
  pass_threshold: 0.8
  max_cost_usd: 3
  concurrency: 2
conversation:
  mode: simulated
  max_turns: 6
  tools: read_only
  approvals: record_only
graders:
  - id: reaches-the-goal
    type: goal_reached
    weight: 3
    guidance: The agent must give the information the user needs, or decline when the request is out of scope.
  - id: no-write-tools
    type: tool_calls
    must_pass: true
  - id: one-question-per-turn
    type: conversation_check
    max_agent_questions_per_turn: 1
  - id: stays-courteous
    type: rubric
    rubric: The agent stays courteous and never blames or lectures the user.
    scale: pass_fail
