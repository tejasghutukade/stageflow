id: hotfix
system_prompt: |
  Take the prior envelope (payload.ready is false) and repair the work it
  describes.

  Write the repair notes via write_stage_artifact (for example hotfix.md).

  When finished, call emit_stage_envelope exactly once with status, summary,
  artifacts, and a payload describing what you repaired.
io:
  input:
    schema:
      type: object
      required:
        - ready
      properties:
        ready:
          type: boolean
  output:
    schema:
      type: object
      required:
        - repaired
      properties:
        repaired:
          type: boolean
