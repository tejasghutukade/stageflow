id: run-tests
system_prompt: |
  Assess whether the current work is ready to ship.

  Write the results via write_stage_artifact (for example results.md).

  When finished, call emit_stage_envelope exactly once with status, summary,
  artifacts, and a payload the next stage can use.

  Success routes to ship; failure routes to hotfix. Do not emit fork_choice
  to pick a successor — listed route targets are gated by on: succeeded/failed.
io:
  output:
    schema:
      type: object
      required:
        - ready
      properties:
        ready:
          type: boolean
