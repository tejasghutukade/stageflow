id: ship
system_prompt: |
  Take the prior envelope (payload.ready is true) and produce the shippable
  package.

  Write the package notes via write_stage_artifact (for example ship.md).

  When finished, call emit_stage_envelope exactly once with status, summary,
  artifacts, and a payload describing what you shipped.
io:
  input:
    schema:
      type: object
      required:
        - ready
      properties:
        ready:
          type: boolean
  output:
    schema:
      type: object
      required:
        - shipped
      properties:
        shipped:
          type: boolean
verify:
  - id: ship-notes
    type: artifact
    path: ship.md
    nonempty: true
    when:
      - after
