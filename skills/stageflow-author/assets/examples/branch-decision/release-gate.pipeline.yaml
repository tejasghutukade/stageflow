id: release-gate
model: anthropic/claude-sonnet-4-5
stages:
  - id: run-tests
    uses: ./run-tests.yaml
    entry: true
    route_select: one
    route:
      - to: hotfix
      - to: ship
  - id: hotfix
    uses: ./hotfix.yaml
  - id: ship
    uses: ./ship.yaml
    on_verify_fail:
      mode: manual
      retry_safety: side_effecting
