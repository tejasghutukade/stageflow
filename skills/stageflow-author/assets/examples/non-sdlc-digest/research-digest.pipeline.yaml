id: research-digest
model: anthropic/claude-sonnet-4-5
stages:
  - id: gather
    uses: ./gather.yaml
    entry: true
    route:
      - to: summarize
  - id: summarize
    uses: ./summarize.yaml
    route:
      - to: send
  - id: send
    uses: ./send.yaml
    on_verify_fail:
      mode: manual
      retry_safety: side_effecting
