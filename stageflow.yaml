version: 1
model: cursor/auto
catalog:
  pipelines:
    - examples
    - workshop
  tasks:
    - examples
    - workshop
  triggers:
    - examples
  patterns:
    pipeline: "*.pipeline.yaml"
    task: "*.task.yaml"
    trigger: "*.trigger.yaml"
  exclude:
    - tests/fixtures
    - examples/route-wiring-smoke-test
    - examples/stage-mcp/stage-mcp-dead.pipeline.yaml
    - examples/stage-mcp/stage-mcp-dead.task.yaml
