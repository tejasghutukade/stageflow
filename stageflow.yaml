version: 1
model: openrouter/nvidia/nemotron-3.5-lightning:free
catalog:
  pipelines:
    - examples
    - workshop
  tasks:
    - examples
    - workshop
  triggers:
    - examples
  evals:
    - examples/evals
  datasets:
    - examples/evals
  patterns:
    pipeline: "*.pipeline.yaml"
    task: "*.task.yaml"
    trigger: "*.trigger.yaml"
  exclude:
    - tests/fixtures
    - examples/route-wiring-smoke-test
    - examples/stage-mcp/stage-mcp-dead.pipeline.yaml
    - examples/stage-mcp/stage-mcp-dead.task.yaml
    - examples/channels-smoke
    - examples/evals/support-sample.eval.yaml
    - examples/memory
