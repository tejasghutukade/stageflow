<style>
  body { font-family: system-ui, sans-serif; margin: 12px; background: #fff; color: #222; }
  #chart { width: 100%; height: 260px; }
  .meta { font-size: 12px; opacity: .7; }
</style>
<div id="chart"></div>
<div class="meta" id="meta">loading…</div>
<script>
  var chart = echarts.init(document.getElementById("chart"));
  var colors = { ok: "#3b6", needs: "#db3", fail: "#e55" };
  async function load() {
    try {
      var data = await window.stageflow.callBinding("health", {});
      var services = data.services || [];
      chart.setOption({
        textStyle: { color: "#333" },
        grid: { left: 70, right: 16, top: 12, bottom: 24 },
        xAxis: { type: "value", name: "ms" },
        yAxis: { type: "category", data: services.map(function (s) { return s.name; }) },
        series: [{ type: "bar", data: services.map(function (s) {
          return { value: s.latency_ms, itemStyle: { color: colors[s.status] || "#888" } };
        }) }]
      });
      document.getElementById("meta").textContent = "updated " + data.generated_at;
    } catch (e) {
      document.getElementById("meta").textContent = "error: " + (e && e.message);
    }
  }
  window.stageflow.initialize();
  window.stageflow.onBindingUpdated(function () { load(); });
  load();
</script>
