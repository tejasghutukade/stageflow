id: feedback-loop
stages:
  - id: feedback-plan
    entry: true
    route:
      - to: feedback-implement
    uses: ./feedback-plan.yaml
  - id: feedback-implement
    route:
      - to: feedback-review
    uses: ./feedback-implement.yaml
  - id: feedback-review
    route:
      - to: submit
      - type: loop
        to: feedback-implement
        max_replays: 2
        on_max_replays: require_continue
        replay_session: resume
    uses: ./feedback-review.yaml
  - id: submit
    uses: ./submit.yaml
    replay_safe: false
