id: feedback-loop-wait-human
stages:
  - id: plan
    entry: true
    route:
      - to: implement
    uses: ./plan.yaml
  - id: implement
    route:
      - to: review
    uses: ./implement.yaml
  - id: review
    route:
      - to: submit
      - type: loop
        to: implement
        max_replays: 1
        on_max_replays: wait_for_human
        replay_session: resume
    uses: ./review.yaml
  - id: submit
    uses: ./submit.yaml
    replay_safe: false
