id: feedback-loop-wait-human
stages:
  - id: feedback-plan
    entry: true
    route:
      - to: feedback-implement
    uses: ./feedback-plan.yaml
  - id: feedback-implement
    route:
      - to: feedback-review
    uses: ./feedback-implement.yaml
  - id: feedback-review
    route:
      - to: submit
      - type: loop
        to: feedback-implement
        max_replays: 1
        on_max_replays: wait_for_human
        replay_session: resume
    uses: ./feedback-review.yaml
  - id: submit
    uses: ./submit.yaml
    replay_safe: false
