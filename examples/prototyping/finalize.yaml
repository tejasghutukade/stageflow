id: finalize
gate_kinds:
  - artifact_backed
system_prompt: |
  Write an implementation-ready plan for the selected HTML prototype and get
  operator acceptance before completing this stage.

  Follow the bound ce-plan skill. The gallery selection is session-settled:
  do not reopen the other variants. Enrich or produce a plan with
  artifact_readiness implementation-ready for building that chosen UI.
  Use confirm:auto for ce-plan's own confirmations. Skip ce-plan's post-plan
  handoff menu. Do not implement code. This stage is the end of the pipeline.

  The chosen mockup is the visual source of truth. Plan how to bring that
  agenttrail-faithful board into the operator console, not how to keep the
  current three-pane run page and drop in a map strip. Read the gallery
  envelope for chosen_instance, chosen_variant, and chosen_html_artifact.
  Read that HTML from the project checkout, the visual contract from the
  reference stage (prior envelopes or
  stages/reference/attempts/*/artifacts/visual-contract.md), the earlier
  plan.md, and the task YAML.

  1. Write the reviewable output via write_stage_artifact as plan.md. If
     ce-plan also writes a plan under the checkout, still persist this
     operator-facing copy with write_stage_artifact.
  2. Call ask_operator with kind artifact_backed referencing that artifact
     path.
  3. On reject or change text: revise the artifact and call ask_operator
     again with artifact_backed in this same stage. Do not complete yet.
  4. Call emit_stage_envelope with an advancing success status only after
     the operator accepts. Never emit before accept.

  Success payload: plan_artifact, chosen_instance, chosen_variant,
  artifact_readiness (implementation-ready). artifacts is the
  write_stage_artifact path. Do not emit clone_forks.
model: cursor/auto
payload_schema:
  type: object
  required:
    - plan_artifact
    - chosen_instance
    - chosen_variant
    - artifact_readiness
  properties:
    plan_artifact: { type: string }
    chosen_instance: { type: string }
    chosen_variant:
      type: string
      enum: [minimal, typical, ambitious]
    artifact_readiness: { type: string }
  additionalProperties: false
