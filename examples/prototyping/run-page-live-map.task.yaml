id: run-page-live-map
goal: |
  Prototype a live spatial run page for Stageflow pipeline runs whose UI and
  UX match agenttrail's live agent map
  (https://github.com/sodiumsun/agenttrail), applied to pipeline stages
  rather than coding-agent sessions.
context: |
  This repo is Stageflow. The current operator-console run page is
  ui/src/pages/RunDetailPage.tsx (route #/runs/:id): linear or mini-DAG
  track, transcript pane, HITL reply/decide UI, artifacts, ~1s poll. That
  page is the problem to replace, not a visual reference.

  Agenttrail is the visual/UX source of truth: a local live board that IS
  the page — zoomable spatial canvas, 5–9 nodes with dependency arrows,
  declared vs observed work, live activity and run cards, VS Code-style
  repo tree with just-touched accents, provenance vs backlog. The operator
  wants that board language identically for watching Stageflow stages on a
  run.

  Domain labels to keep (not chrome): pending, running, waiting_for_input,
  succeeded, failed, skipped; HITL gate kinds; clone/fork instance ids;
  envelopes; artifacts.

  Produce three self-contained HTML mockups (minimal / typical / ambitious)
  as agenttrail-IA-depth variants of the same board, not as "how much of
  today's console to keep." Prototype clones run in parallel. Each clone
  writes docs/prototype/<variant>/index.html. Gallery joins them at
  docs/prototype/index.html.
constraints: |
  Self-contained HTML mockups only; do not rewrite production React. Do not
  copy current operator-console layout, three-pane chrome, track band, or
  console.css. Stay on the Stageflow run-watching problem, not a generic
  coding-agent dashboard. Write prototypes only under docs/prototype/. Do
  not use write_stage_artifact for the mockup HTML.
