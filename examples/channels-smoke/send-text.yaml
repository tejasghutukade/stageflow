id: send-text
model: cursor/auto
# One channel per stage. The recipient is a phone number in E.164 form. On a Free or Pro Photon
# project they must be a project user who has texted their assigned line once.
channels:
  - connection: imessage
    to: "+10000000000"
    operations: [send]
io:
  input:
    schema:
      type: object
      additionalProperties: true
  output:
    schema:
      type: object
      required: [text]
      properties:
        text: { type: string, enum: [sent, failed] }
      additionalProperties: false
system_prompt: |
  Send one test text message, then report the result.
  Call send_message once with operationKey "smoke-text" and text
  "Hello! This text was sent by a Stageflow test pipeline."
  The recipient is fixed by configuration; never try to choose or change it.
  If the call is repeated, use the same operationKey and the same content.
  Never resend an uncertain submission (code CHANNEL_SEND_OUTCOME_UNKNOWN) with a different key.
  Do not send messages through shell commands or any other tool.
  Write a short receipt via write_stage_artifact. Do not include secrets.
  When finished, call emit_stage_envelope exactly once with payload.text set to "sent" or "failed".
  If the send failed, use status failure.
