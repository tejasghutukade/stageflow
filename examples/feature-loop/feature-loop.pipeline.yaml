id: feature-loop
schemas:
  story-assignment:
    type: object
    required:
      - story_id
      - title
      - epic_slice
      - acceptance
      - neighboring_story_ids
      - constraints
    properties:
      story_id:
        type: string
      title:
        type: string
      epic_slice:
        type: string
      acceptance:
        type: string
      neighboring_story_ids:
        type: array
        items:
          type: string
      constraints:
        type: array
        items:
          type: string
stages:
  - id: decompose
    uses: ./decompose.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: plan
    uses: ./plan.yaml
    needs: decompose
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: align
    uses: ./align.yaml
    needs: plan
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: implement
    uses: ./implement.yaml
    needs: align
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: verify
    uses: ./verify.yaml
    needs: implement
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: review
    uses: ./review.yaml
    needs: verify
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: address-feedback
    uses: ./address-feedback.yaml
    needs: review
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
    feedback_loop:
      target: review
      max_replays: 2
      on_max_replays: wait_for_human
      replay_session: new_session
  - id: publish
    uses: ./publish.yaml
    needs: address-feedback
    on_verify_fail:
      mode: manual
      retry_safety: side_effecting
    replay_safe: false
