id: feature-loop
stages:
  - id: decompose
    uses: ./decompose.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: plan
    uses: ./plan.yaml
    needs: decompose
    clonable: true
    clone_cap: 8
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: align
    uses: ./align.yaml
    needs: plan
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: implement
    uses: ./implement.yaml
    needs: align
    clonable: true
    clone_cap: 8
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: verify
    uses: ./verify.yaml
    needs: implement
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: review
    uses: ./review.yaml
    needs: verify
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: address-feedback
    uses: ./address-feedback.yaml
    needs: review
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
    feedback_loop:
      target: review
      max_replays: 2
      on_max_replays: wait_for_human
      replay_session: new_session
  - id: publish
    uses: ./publish.yaml
    needs: address-feedback
    on_verify_fail:
      mode: manual
      retry_safety: side_effecting
    replay_safe: false
