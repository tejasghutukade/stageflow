id: feature-loop
schemas:
  story-assignment:
    type: object
    required:
      - story_id
      - title
      - epic_slice
      - acceptance
      - neighboring_story_ids
      - constraints
    properties:
      story_id:
        type: string
      title:
        type: string
      epic_slice:
        type: string
      acceptance:
        type: string
      neighboring_story_ids:
        type: array
        items:
          type: string
      constraints:
        type: array
        items:
          type: string
  story-work:
    type: object
    required:
      - story_id
      - title
      - plan_artifact
      - order
      - depends_on
      - planned_files
      - validation_commands
    properties:
      story_id:
        type: string
      title:
        type: string
      plan_artifact:
        type: string
      order:
        type: integer
        minimum: 1
      depends_on:
        type: array
        items:
          type: string
      planned_files:
        type: array
        items:
          type: string
      validation_commands:
        type: array
        items:
          type: string
stages:
  - id: decompose
    uses: ./decompose.yaml
    entry: true
    clone_cap: 8
    clone_mode: parallel
    route:
      - to: plan
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: plan
    uses: ./plan.yaml
    route:
      - to: align
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: align
    uses: ./align.yaml
    clone_cap: 8
    clone_mode: sequential
    route:
      - to: implement
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: implement
    uses: ./implement.yaml
    route:
      - to: verify
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: verify
    uses: ./verify.yaml
    route:
      - to: review
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: review
    uses: ./review.yaml
    route:
      - to: address-feedback
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: address-feedback
    uses: ./address-feedback.yaml
    route:
      - to: publish
      - type: loop
        to: review
        max_replays: 2
        on_max_replays: wait_for_human
        replay_session: new_session
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: publish
    uses: ./publish.yaml
    on_verify_fail:
      mode: manual
      retry_safety: side_effecting
    replay_safe: false
