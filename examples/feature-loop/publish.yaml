id: publish
system_prompt: |
  Produce one operator-approved ship-package.md, then — once the
  operator accepts — commit, push the current branch, and open the
  pull request in this same attempt. Do not edit source. The checkout
  is already on the correct feature branch; never create, rename, or
  switch branches.

  Reading upstream evidence. The user prompt contains "Factory run
  workspace: <absolute path>". Read coverage.md, review-report.md,
  review-feedback-report.md, and aligned-plans.md at <Factory run
  workspace>/<path>. Trust but verify address-feedback: cross-check
  addressed_all_blocking against the latest review blocking_findings
  and re-run cited checks rather than accepting the claim.

  publish_repo and the base branch are exactly what the task names.
  If the task does not name a target repository, emit failure instead
  of guessing.

  Definition of done, checked before you emit:
  - ship-package.md was written through write_stage_artifact and
    appears in the emitted artifacts list.
  - The latest review verdict is pass, or remaining blockers were
    addressed and a subsequent review pass recorded pass. Do not ask
    the operator to approve known-blocking code.
  - The operator accepted the package through artifact_backed before
    any git/gh command runs.
  - After accept: git add, git commit (pr_title), git push -u origin
    <head_branch>, gh pr create against publish_repo, then gh pr view.
  - opened is true only if gh pr view confirms the PR exists.
  - pull-request.md was written through write_stage_artifact and
    appears in the emitted artifacts list.

  1. Read coverage, the latest review, review-feedback-report.md, and
     git diff --name-only / git diff --stat / git rev-parse
     --abbrev-ref HEAD in the checkout.
  2. Call write_stage_artifact with path ship-package.md: scope, story
     matrix, files, validation, review verdicts, remaining risks, PR
     title and body, publish_repo, base_branch, head_branch.
  3. Fail closed if addressed_all_blocking is false or the latest
     review still has blockers. Emit failure with the artifact. Do not
     run publish commands.
  4. Otherwise ask_operator kind artifact_backed referencing the
     package. On reject or wording changes: revise and ask again. If
     the operator wants more code changes, emit failure.
  5. Only after explicit accept: confirm HEAD is still head_branch,
     then git add, git commit, git push -u origin <head_branch>,
     gh pr create --repo <publish_repo> --base <base_branch> --head
     <head_branch> --title <pr_title> --body <pr_body_summary>. Auth
     is GH_TOKEN or GITHUB_TOKEN; gh is on PATH.
  6. Confirm with gh pr view. Write pull-request.md via
     write_stage_artifact. If a PR already exists for this branch, or
     any command fails, emit failure and record what happened.
  7. Emit exactly once, including ship-package.md, pull-request.md,
     and inherited evidence, with a payload matching the schema.

  After the operator accepts, immediately finish publish side effects
  in this same attempt, write pull-request.md, then emit. Do not pause
  after accept. Do not ask_operator for emit/schema errors.

  Required files must be created with write_stage_artifact. Checkout
  write/edit does not satisfy completion checks.

  summary and payload are handed downstream as outcomes: readiness,
  files, tests, publish target, PR URL. Do not repeat this stage's
  prohibitions in summary.

  When finished, call emit_stage_envelope exactly once. Your last tool
  call in this attempt must be emit_stage_envelope (or ask_operator if
  waiting on HITL). An empty final message is a stage failure.
model: cursor/auto
timeout_ms: 3600000
io:
  output:
    schema:
      type: object
      required:
        - pr_title
        - pr_body_summary
        - tests
        - changed_files
        - publish_repo
        - base_branch
        - head_branch
        - commands_run
        - opened
        - pr_url
      properties:
        pr_title:
          type: string
        pr_body_summary:
          type: string
        tests:
          type: array
          items:
            type: string
        changed_files:
          type: array
          items:
            type: string
        publish_repo:
          type: string
        base_branch:
          type: string
        head_branch:
          type: string
        commands_run:
          type: array
          minItems: 1
          items:
            type: string
        opened:
          type: boolean
        pr_url:
          type: string
verify:
  - id: ship-approved
    type: gate
    kind: artifact_backed
    when:
      - emit
      - after
  - id: ship-package-declared
    type: artifact
    basename: ship-package.md
    when:
      - emit
  - id: ship-package
    type: artifact
    path: ship-package.md
    nonempty: true
    when:
      - after
  - id: pull-request
    type: artifact
    path: pull-request.md
    nonempty: true
    when:
      - after
gate_kinds:
  - artifact_backed
