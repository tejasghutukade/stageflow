id: archify-on-pr
stages:
  - id: detect-changes
    uses: ./detect-changes.yaml
    fork:
      select: subset
      allow_none: true
    on_verify_fail:
      mode: repair
      max_attempts: 2
      retry_safety: idempotent
      include_failed_checks: true
  - id: author-diagrams
    uses: ./author-diagrams.yaml
    skill: archify
    needs: detect-changes
