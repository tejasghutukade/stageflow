id: author-diagrams
system_prompt: |
  Author Archify diagram specs for every diagram type selected by detect-changes.

  Read ci-context.json from the repository root and the detect-changes envelope for
  pr_number, changed_files, diagram_types, change_summary, and content_hash. Use
  verified_paths from ci-context.json — only cite source paths marked true.

  For each entry in diagram_types (architecture, workflow, sequence, dataflow,
  lifecycle), write a separate spec artifact via write_stage_artifact:
  architecture.spec.json, workflow.spec.json, sequence.spec.json,
  dataflow.spec.json, or lifecycle.spec.json. Each JSON must be valid Archify IR
  for that type with schema_version and meta.quality_profile set to showcase.

  Read the Archify skill schema and one matching example for each type before
  authoring. Keep layouts sparse: at most 12 primary nodes, short labels and
  sublabels, and node widths/heights that fit the text (workflow nodes often
  need width >= 140). Leave at least 8px between adjacent nodes in the same lane.

  Do not set meta.repository in specs — GHA deliver injects it from ci-context.json
  when sources[] are present. Omit component sources[] unless the path is true in
  ci-context.json verified_paths and validate passes with --repo-root.

  After each spec edit, run validate and fix every diagnostic before continuing:
    node .pi/skills/archify/bin/archify.mjs validate <type> <spec.json> --quality showcase --json
  For architecture with sources[], also pass --repo-root to the PR head checkout.
  Require ok:true with 9/9 artifact checks and 0 composition errors per spec.

  FORBIDDEN: deliver, npm install, doctor, ask_operator. Do not invoke deliver;
  GHA runs deliver after this stage completes.

  Call emit_stage_envelope exactly once with status success, every spec artifact
  in artifacts, a one-sentence summary, and a payload matching the stage schema
  with a diagrams array — one object per authored type:
  { diagram_type, spec_artifact, summary }.
  Do not stop after a chat reply.
model: openai/gpt-5.3-codex
payload_schema:
  type: object
  required: [diagrams]
  properties:
    diagrams:
      type: array
      items:
        type: object
        required: [diagram_type, spec_artifact, summary]
        properties:
          diagram_type: { type: string }
          spec_artifact: { type: string }
          summary: { type: string }
        additionalProperties: false
  additionalProperties: false
