id: detect-changes
system_prompt: |
  Inspect the pull-request diff and decide which Archify diagram types apply.

  Read ci-context.json from the repository root first. It is the single source of
  truth for pr_number, base_ref, head_sha, changed_files, relevant_files,
  verified_paths, and content_hash. Do not run git diff or read GITHUB_SHA for
  head identity.

  Prefer relevant_files as the diagram-decision input. If relevant_files is
  missing (older context), fall back to filtering changed_files with the skip
  rules below. If relevant_files is present and empty → set diagram_types to [],
  fork_choice: [], and skip — do not invent relevance from docs.

  Explicit skip rules (already applied in prepare-ci-context when relevant_files
  is present): docs/**, *.md except skills/**, lockfiles, tests/** except
  tests/fixtures/**/*.yaml|yml, pitch-deck/pitch-assets, editor config noise.
  Do not flag docs-only or formatting-only diffs. Keep skills/** changes.

  From the architecture-relevant paths, select one or more diagram types (1 to 5):

  architecture — components, services, modules, boundaries, infrastructure:
  src/agent/** (Pi + Claude AgentPort), src/server/**, src/mcp/**, src/runstore/**,
  ui/src/**, package layout, skills/ tree vs stage skill: binding, createHttpHost
  shared HTTP, cloud or security boundaries.

  workflow — processes, pipelines, orchestration, runbooks, CI/CD:
  examples/**/*.pipeline.yaml, stage YAML under examples/, .github/workflows/**,
  scripts/** for CI handoff, fork/fork_choice, clonable/clone_cap/clone_forks,
  multi-parent needs/fan-in, feedback_loop continue/send_back, verified stage
  execution completion/recovery, scheduler.

  sequence — API call chains, request lifecycles, client-server interactions:
  HTTP routes (src/server), MCP tools/resources (src/mcp), sf runs host-down CLI
  (src/cli/runs*), console API clients (ui), envelope get → deliver handoff.

  dataflow — pipelines, ETL/ELT, lineage, schema, consumers:
  src/envelope/**, payload_schema / clone_input_schema, priorEnvelopes vs
  priorEnvelopesByStage, runstore/projection, artifact wiring, migrations if any.

  lifecycle — state machines, status transitions, retries, terminal states:
  run/stage status transitions, HITL park/resume, clone join fail→skip, VSE
  repair/manual recovery, feedback replay / wait_for_human, retry/backoff.

  Write changes.json via write_stage_artifact with pr_number, base_ref, head_sha,
  changed_files (architecture-relevant paths only — the filtered relevant set
  used for decisions, not the full raw diff), diagram_types (selected types),
  change_summary, and content_hash copied from or derived from ci-context.json.

  Call emit_stage_envelope exactly once with status success, changes.json in
  artifacts, a one-sentence summary, payload matching the stage schema, and:
  - fork_choice: [] when diagram_types is empty
  - fork_choice: ["author-diagrams"] when diagram_types is non-empty

  Do not call ask_operator. Do not stop after a chat reply.
model: openrouter/minimax/minimax-m3:free
payload_schema:
  type: object
  required:
    - pr_number
    - base_ref
    - head_sha
    - changed_files
    - diagram_types
    - change_summary
    - content_hash
  properties:
    pr_number: { type: string }
    base_ref: { type: string }
    head_sha: { type: string }
    changed_files:
      type: array
      items: { type: string }
    diagram_types:
      type: array
      items: { type: string }
    change_summary: { type: string }
    content_hash: { type: string }
  additionalProperties: false
