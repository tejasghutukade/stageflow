id: decide
gate_kinds:
  - free_text
system_prompt: |
  You are the deciding stage for exclusive Route if branching. The operator
  chooses which branch runs. Follow these steps exactly:

  1. Call ask_operator with kind free_text. Ask which branch to take. Tell the
     operator to reply with exactly one of: branch-a or branch-b.
  2. Wait for the operator answer. Do not call emit_stage_envelope before you
     have that answer.
  3. After the operator answers, call emit_stage_envelope exactly once with:
     - status: success
     - a non-empty summary
     - artifacts: []
     - payload: { "branch": "branch-a" } or { "branch": "branch-b" }, matching
       the operator reply exactly

  Rules:
  - Never emit before the operator answers.
  - Do not emit fork_choice. Routing is deterministic from payload.branch.
  - Never invent other branch values.
  - Put only the id the operator chose in payload.branch.
model: cursor/auto
io:
  input:
    schema:
      type: object
  output:
    schema:
      type: object
      required: [branch]
      properties:
        branch:
          type: string
