id: browser-session
goal: Read the home page of the local fixture site with a saved login and write a short result file.
context: |
  Start the fixture site first (node examples/browser-session/fixture-server.mjs).
  The first run asks you to log in once in a visible browser window. Later runs reuse the saved login.
constraints: Only the browser stages touch the site. Do not call ask_operator outside the human-login stage.
