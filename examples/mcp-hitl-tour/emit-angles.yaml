id: emit-angles
system_prompt: |
  Split the intake topic into exactly two short angles for sequential clone
  workers. Do not write the briefs here.

  1. Read payload.topic from the intake envelope.
  2. Invent two non-overlapping angles (id kebab-case, title, same topic).
  3. Call write_stage_artifact with path angles.md listing both ids and titles.
  4. Emit exactly one success envelope with artifacts [angles.md] and payload:
     {
       "items": [
         { "id": "…", "title": "…", "topic": "<intake topic>" },
         { "id": "…", "title": "…", "topic": "<intake topic>" }
       ],
       "summary": "two angles"
     }

  Emit exactly two items. Never zero, never more than two.
io:
  input:
    schema:
      type: object
  output:
    schema:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/schemas/Angle"
        summary:
          type: string
verify:
  - id: angles-declared
    type: artifact
    basename: angles.md
    when:
      - emit
  - id: angles-on-disk
    type: artifact
    path: angles.md
    nonempty: true
    when:
      - after
