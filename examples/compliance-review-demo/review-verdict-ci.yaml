id: review-verdict-ci
system_prompt: |
  This is the CI variant of the review gate — it never pauses for a human.
  An unattended pipeline can't answer ask_operator, so this stage never
  calls it. It still detects a flip and records that fact in the evidence
  row, it just doesn't block on it.

  1. Read examples/compliance-review-demo/data/evidence-log.json if it
     exists (checkout-relative path, use the Read tool). Find the most
     recent entry for this run's check_id + resource, if any.
  2. No prior entry, or the prior entry's verdict matches this run's
     verdict: set reviewer = "ci".
  3. Prior entry exists and its verdict differs from this run's verdict (a
     flip): set reviewer = "ci-unreviewed-flip" and write a short artifact
     via write_stage_artifact noting the flip and that CI approved it
     without human confirmation, so a person can follow up later.
  4. In both cases set reviewed = false and auto_approved = true. Never
     call ask_operator — this stage has no gate_kinds and must not wait on
     one. Always emit an advancing success status; this stage must not
     fail the run just because a flip occurred.

  summary and payload are handed to the next stage verbatim. State outcomes
  and artifact pointers only. Do not repeat this stage's prohibitions in
  summary — downstream will obey them literally.

  When finished, call emit_stage_envelope exactly once with status, summary,
  artifacts, and a payload matching io.output.schema: everything carried
  forward from the prior stage, plus reviewed, auto_approved, and reviewer
  as described above. Your last tool call in this attempt must be
  emit_stage_envelope. An empty final message is a stage failure.
model: anthropic/claude-sonnet-4-5
io:
  input:
    schema:
      type: object
      required:
        - bucket
        - check_id
        - scenario
        - source
        - block_public_acls
        - ignore_public_acls
        - block_public_policy
        - restrict_public_buckets
        - verdict
        - resource
        - failed_fields
      properties:
        bucket:
          type: string
        check_id:
          type: string
        scenario:
          type: string
        source:
          type: string
        block_public_acls:
          type: boolean
        ignore_public_acls:
          type: boolean
        block_public_policy:
          type: boolean
        restrict_public_buckets:
          type: boolean
        verdict:
          type: string
        resource:
          type: string
        failed_fields:
          type: array
          items:
            type: string
  output:
    schema:
      type: object
      required:
        - bucket
        - check_id
        - scenario
        - source
        - block_public_acls
        - ignore_public_acls
        - block_public_policy
        - restrict_public_buckets
        - verdict
        - resource
        - failed_fields
        - reviewed
        - auto_approved
        - reviewer
      properties:
        bucket:
          type: string
        check_id:
          type: string
        scenario:
          type: string
        source:
          type: string
        block_public_acls:
          type: boolean
        ignore_public_acls:
          type: boolean
        block_public_policy:
          type: boolean
        restrict_public_buckets:
          type: boolean
        verdict:
          type: string
        resource:
          type: string
        failed_fields:
          type: array
          items:
            type: string
        reviewed:
          type: boolean
        auto_approved:
          type: boolean
        reviewer:
          type: string
