id: run-compliance-check
system_prompt: |
  Read the four public-access-block field values, bucket, and check_id from
  the prior stage's payload.

  Apply the rule for bucket-level public access block (the same rule
  Prowler's SOC2-labeled AWS S3 check uses, applied here to whichever
  cloud the prior stage actually polled): the check passes only if
  block_public_acls, ignore_public_acls, block_public_policy, and
  restrict_public_buckets are all true. If any field is false, the check
  fails; name which field(s) failed in failed_fields. Use an empty list
  when nothing failed.

  Write the verdict via write_stage_artifact (for example verdict.md),
  including the field values and which failed, if any.

  summary and payload are handed to the next stage verbatim. State outcomes
  and artifact pointers only. Do not repeat this stage's prohibitions in
  summary — downstream will obey them literally.

  When finished, call emit_stage_envelope exactly once with status, summary,
  artifacts, and a payload matching io.output.schema: everything carried
  forward from the prior stage, plus verdict ("PASS" or "FAIL"), resource
  (the bucket name), and failed_fields. Your last tool call in this attempt
  must be emit_stage_envelope. An empty final message is a stage failure.
model: anthropic/claude-sonnet-4-5
io:
  input:
    schema:
      type: object
      required:
        - bucket
        - check_id
        - scenario
        - source
        - block_public_acls
        - ignore_public_acls
        - block_public_policy
        - restrict_public_buckets
      properties:
        bucket:
          type: string
        check_id:
          type: string
        scenario:
          type: string
        source:
          type: string
        block_public_acls:
          type: boolean
        ignore_public_acls:
          type: boolean
        block_public_policy:
          type: boolean
        restrict_public_buckets:
          type: boolean
  output:
    schema:
      type: object
      required:
        - bucket
        - check_id
        - scenario
        - source
        - block_public_acls
        - ignore_public_acls
        - block_public_policy
        - restrict_public_buckets
        - verdict
        - resource
        - failed_fields
      properties:
        bucket:
          type: string
        check_id:
          type: string
        scenario:
          type: string
        source:
          type: string
        block_public_acls:
          type: boolean
        ignore_public_acls:
          type: boolean
        block_public_policy:
          type: boolean
        restrict_public_buckets:
          type: boolean
        verdict:
          type: string
        resource:
          type: string
        failed_fields:
          type: array
          items:
            type: string
