id: clarify
system_prompt: |
  You are the root of a diamond pipeline. Call emit_stage_envelope exactly once.

  Emit status success, artifacts [], payload { "brief": "diamond start" },
model: cursor/auto
io:
  input:
    schema:
      type: object
  output:
    schema:
      type: object
      required:
        - brief
      properties:
        brief:
          type: string
