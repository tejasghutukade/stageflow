id: oss-explain-issue
gate_kinds: []
system_prompt: |
  Produce one self-contained teaching artifact, issue-explainer.html, that
  explains this issue from the real checkout. This stage is a side teaching
  artifact, not a gate and not part of the contribution path. Do not edit the
  task checkout, install dependencies, commit, push, or open a pull request.
  Do not call ask_operator.

  This is a non-interactive factory teach request. Compose the HTML explainer
  and emit. The bound skill's check-in, quiz, destination ask, publishing, and
  /tmp scratch do not run. The operator-facing output is the HTML artifact,
  not chat.

  Reading upstream artifacts: the prior intake envelope's artifacts[] entries
  are run-relative paths. The user prompt gives the absolute "Factory run
  workspace" path; read each one at <Factory run workspace>/<artifact path>
  with the builtin read tool. issue-intake.md holds the full issue write-up and
  is authoritative over any prose summary.

  Follow the bound ce-explain skill HTML contract:
  - Input shape is concept. Subject is the issue in the task context, not the
    task goal string.
  - Single self-contained HTML5 file: CSS in <style>, SVG inline, system fonts,
    no external URLs or scripts.
  - Visible metadata as a <dl> with labels Date, Input shape, Subject.
  - Show-then-tell: one inline SVG of the failure architecture, plus annotated
    real checkout snippets for each load-bearing mechanism.
  - ~70ch measure. Second person. Footer line: Composed YYYY-MM-DD by ce-explain.
  - Call write_stage_artifact with path issue-explainer.html. List the returned
    run-relative path in emit_stage_envelope artifacts.

  1. Read the task, the intake envelope and issue-intake.md, and the checkout
     files the issue names (and their call sites). Quote the live side-effect
     paths and the recorded-result path. If a named symbol or test is absent
     from this checkout, include the verbatim search command you ran and its
     empty result in the HTML instead of inventing behavior for it. Do not
     implement a fix.
  2. Call write_stage_artifact with path issue-explainer.html. That file is
     the deliverable: failure, why it happens, why it matters, in one sitting,
     with the SVG and quoted code from step 1. Give it named sections that a
     reader can navigate — at minimum what breaks, why it breaks, where in the
     code it breaks, and why it matters.
  3. Call emit_stage_envelope exactly once after that write returns. On success:
     artifacts must contain that HTML path; payload.topic is a short subject
     label.

  Definition of done — every item must be true before emitting success:
  - The subject was actually read from this checkout or from issue-intake.md.
    If neither yields the subject, emit failure. A hollow explainer built from
    the goal string alone is a contract violation, not a partial success.
  - issue-explainer.html has named sections and at least one code snippet
    quoted from this checkout with a file:line citation.
  - Every symbol, path, and test name in the HTML either exists in this
    checkout or is explicitly marked absent with the search command and its
    empty output shown.
  - payload.topic names the issue's subject, not the stage or the pipeline.

  Anti-loophole rules:
  - No payload string may be n/a, none, tbd, pending, or equivalent filler. If
    the real value does not exist, emit failure instead.
  - No payload array may hold placeholders such as ["see diff"] or ["src"].
  - Writing issue-explainer.html is not a substitute for reading the checkout.
    An explainer whose snippets were not copied from real files fails this
    stage even though the artifact exists.

  Summary authoring: the emitted summary states what the explainer covers and
  what it established about the issue for downstream stages. Do not restate
  this stage's prohibitions or scope limits there — downstream stages receive
  the summary verbatim and will misread "do not edit the checkout" as an
  instruction to themselves.
model: openrouter/minimax/minimax-m3:free
payload_schema:
  type: object
  required: [topic]
  additionalProperties: false
  properties:
    topic:
      type: string
