  rather than pydantic/pydantic-ai.
context: |
  Issue: https://github.com/pydantic/pydantic-ai/issues/7971
  Title: Carry a durable unit's emitted events and enqueued messages in its recorded output
  Upstream repo: https://github.com/pydantic/pydantic-ai
  Fork (PR target after the run): https://github.com/tejasghutukade/pydantic-ai
  State: OPEN, unassigned. Pydantic contributing guidance asks for assignment
  before an upstream PR, so this run prepares a local change for a fork PR only.

  Reported behavior: under durable execution, ctx.emit() and ctx.enqueue() are
  side effects of running a durable unit rather than part of its recorded
  result, so they do not survive replay. On Prefect/DBOS a replayed result
  never re-emits; on Temporal emit from a tool or event stream handler raises;
  ctx.enqueue() is rejected on all three engines. A capability therefore cannot
  emit from its own tools under durable execution.

  Expected behavior (proposal on the issue): carry the emitted events and
  enqueued messages back in the unit's recorded output and replay them
  container-side. (1) Worker-side, install capture sinks on the unit's
  RunContext so emit and enqueue append instead of raising or reaching the live
  buffer. (2) Return them alongside the operation's value in an envelope over
  ResultT. (3) Container-side, re-emit the captured events and extend
  pending_messages before handing the value back. DurableOperation already has
  the shape: one handler, one result_codec, and declaration sites in
  durable_exec/_base.py.

  Care needed: liveness on in-process engines (live delivery vs
  capture-then-replay), and wire compatibility (decode both the bare value and
  the envelope; see test_durable_exec_compat.py).

  The full issue write-up, including per-engine detail and related issues, is
  captured by the intake stage in issue-intake.md.
