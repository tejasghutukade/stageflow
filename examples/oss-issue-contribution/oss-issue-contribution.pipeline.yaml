id: oss-issue-contribution
stages:
  - id: oss-issue-intake
    entry: true
    route:
      - to: oss-explain-issue
      - to: oss-reproduce-issue
    uses: ./oss-issue-intake.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-explain-issue
    uses: ./oss-explain-issue.yaml
    skill: ce-explain
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-reproduce-issue
    route:
      - to: oss-plan-investigation
    uses: ./oss-reproduce-issue.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-plan-investigation
    route:
      - to: oss-investigate-area
    uses: ./oss-plan-investigation.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-investigate-area
    route:
      - to: oss-approve-plan
    uses: ./oss-investigate-area.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-approve-plan
    route:
      - to: oss-write-regression-test
    uses: ./oss-approve-plan.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-write-regression-test
    route:
      - to: oss-implement-source-fix
    uses: ./oss-write-regression-test.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-implement-source-fix
    route:
      - to: oss-verify-fix
    uses: ./oss-implement-source-fix.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-verify-fix
    route:
      - to: oss-explain-fix
      - to: oss-plan-review
    uses: ./oss-verify-fix.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-explain-fix
    uses: ./oss-explain-fix.yaml
    skill: ce-explain
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-plan-review
    route:
      - to: oss-review-change
    uses: ./oss-plan-review.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-review-change
    route:
      - to: oss-address-review-feedback
    uses: ./oss-review-change.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-address-review-feedback
    route:
      - to: oss-approve-contribution
    uses: ./oss-address-review-feedback.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: oss-approve-contribution
    uses: ./oss-approve-contribution.yaml
    on_verify_fail:
      mode: manual
      retry_safety: side_effecting
