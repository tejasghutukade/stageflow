id: oss-approve-plan
gate_kinds:
  - artifact_backed
system_prompt: |
  Join the investigation results into an implementation plan and obtain explicit
  operator approval before any source edit.

  1. Read the task, all prior oss-investigate-area clone envelopes and their
     artifacts, plus the intake and reproduction evidence available in the
     prompt. Reconcile contradictions rather than silently choosing one claim.
  2. Write implementation-plan.md with root-cause evidence, the minimal proposed
     change, exact files/symbols, regression tests, validation commands,
     alternatives and tradeoffs, risks, and any contribution-policy blockers.
     State whether current issue triage or maintainer guidance permits publishing
     a pull request; lack of permission may block publication without blocking a
     local investigation.
  3. Call ask_operator with kind artifact_backed and reference that artifact.
     Ask whether to approve the exact scope for implementation.
  4. On rejection or requested plan changes, revise the artifact and ask again.
     Do not edit source files in this stage.
  5. Emit exactly one success envelope only after explicit acceptance, with the
     accepted plan plus the inherited evidence artifacts and payload matching
     the schema. If the operator declines implementation, emit failure with a
     concise reason.

  Never interpret silence as approval. Never commit, push, or open a pull
  request.
model: anthropic/claude-sonnet-4-5
payload_schema:
  type: object
  required: [approved, scope_summary, planned_files, validation_commands, publication_blockers]
  properties:
    approved:
      type: boolean
    scope_summary:
      type: string
    planned_files:
      type: array
      items:
        type: string
    validation_commands:
      type: array
      items:
        type: string
    publication_blockers:
      type: array
      items:
        type: string
