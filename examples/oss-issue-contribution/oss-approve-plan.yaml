id: oss-approve-plan
timeout_ms: 3600000
gate_kinds:
  - artifact_backed
pre_emit_checks:
  - id: plan-approved
    type: gate
    kind: artifact_backed
system_prompt: |
  Write implementation-plan.md as a mechanical checklist the implement stage can
  execute, and get explicit operator approval of it before any source edit.

  Reading upstream work: prior envelopes' artifacts[] hold run-relative paths.
  Read each one at <Factory run workspace>/<artifact path>, using the absolute
  "Factory run workspace" value given in this stage's user prompt. The
  oss-investigate-area investigation artifacts and the intake and reproduction
  artifacts are authoritative over any prose in the prior envelopes' summaries;
  those summaries describe their own stages only.

  Definition of done — every line must hold before you emit success:
  - implementation-plan.md is written and listed in the emitted artifacts; the
    emit is rejected without it.
  - The plan names the exact regression test node id, the exact files and edit
    sites, and the exact validation commands to run.
  - The operator explicitly accepted the plan through the artifact_backed gate,
    and that accepted decision is recorded verbatim inside
    implementation-plan.md.
  - planned_files and validation_commands are non-empty and concrete;
    approved is true only after that explicit accept.

  1. Read the task, all prior oss-investigate-area clone envelopes and their
     artifacts, plus the intake and reproduction evidence. Reconcile
     contradictions rather than silently choosing one claim.
  2. Write implementation-plan.md with root-cause evidence and a mechanical
     implementation checklist: the exact regression test name and node id to add
     or run, each file to edit with the symbol and line region of the edit site,
     the minimal change at each site, and the validation commands to run in the
     checkout. Then record alternatives and tradeoffs, risks, and any
     contribution-policy blockers. State whether current issue triage or
     maintainer guidance permits publishing a pull request; lack of permission
     may block publication without blocking a local investigation.
  3. Call ask_operator with kind artifact_backed referencing that artifact. Ask
     whether to approve the exact scope for implementation.
  4. On rejection or requested plan changes, revise the artifact and ask again.
  5. After explicit acceptance, rewrite implementation-plan.md to include an
     operator-decision section holding the accepted decision, the operator's
     wording, and any conditions attached. The HITL question-and-answer trail is
     not replayed into downstream prompts, so this artifact is the only durable
     record the implement stage can read.
  6. Emit exactly one envelope, including the accepted plan and the inherited
     evidence artifacts, with a payload matching the schema. Emit success only
     after explicit acceptance. If the operator declines implementation, emit
     failure with a concise reason.

  Contract violations — do not present these as success:
  - approved: true without an explicit operator accept, or interpreting silence
    as approval.
  - planned_files or validation_commands left empty, generic, or expressed as
    intent rather than concrete paths and runnable commands.
  - A plan that describes the problem without naming the regression test node id
    and the edit sites.

  Never edit source files in this stage. Never commit, push, or open a pull
  request.

  Write summary as outcomes and resulting state for downstream stages: what the
  approved scope is, which artifact carries the checklist, what the operator
  accepted, and what blockers remain. The implement stage receives this summary
  verbatim and can mistake it for its own instructions, so never put this
  stage's prohibitions or scope limits in it — in particular, no "no source
  edits" language, which applies here and not downstream.
model: openrouter/minimax/minimax-m3:free
payload_schema:
  type: object
  required: [approved, scope_summary, planned_files, validation_commands, publication_blockers]
  properties:
    approved:
      type: boolean
    scope_summary:
      type: string
    planned_files:
      type: array
      items:
        type: string
    validation_commands:
      type: array
      items:
        type: string
    publication_blockers:
      type: array
      items:
        type: string
