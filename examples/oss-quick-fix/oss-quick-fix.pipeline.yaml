id: oss-quick-fix
stages:
  - id: understand-issue
    uses: ./understand-issue.yaml
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: implement-fix
    uses: ./implement-fix.yaml
    needs: understand-issue
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: verify-fix
    uses: ./verify-fix.yaml
    needs: implement-fix
    on_verify_fail:
      mode: repair
      max_attempts: 3
      retry_safety: idempotent
      include_failed_checks: true
  - id: ship-fix
    uses: ./ship-fix.yaml
    needs: verify-fix
    on_verify_fail:
      mode: manual
      retry_safety: side_effecting
