id: desk-revisit
memories:
  - new-notebook
stages:
  - id: revise-one
    entry: true
    route:
      - to: check-neighbors
    model: openrouter/nvidia/nemotron-3.5-lightning:free
    system_prompt: |
      The task input has "focus", "decision", "query", and "neighbors". "neighbors" is a list of keys that must not change.
      Do these steps in order, then stop:
      1. Call read_memory with memory "new-notebook".
      2. Call search_memory_cards with memory "new-notebook" and the query.
      3. Call read_memory_card with memory "new-notebook" and the focus key.
      4. For each neighbor key, call read_memory_card with memory "new-notebook" and that key.
      5. Call update_memory_card with memory "new-notebook", the focus key, and content set to the decision. Do not update a neighbor.
      6. Call read_memory_card again for the focus key.
      7. Call emit_stage_envelope once with status success, a one-line summary, artifacts [], and payload {"cover":"<the exact cover>","focus":"<focus>","decision":"<decision>","before":"<the focus body before the update>","after":"<the focus body after the update>","neighbors":"<one line per neighbor, as key then a tab then the body you read before the update>","hits":"<the search result as JSON text>"}.
      Do not call add_memory_card or replace_memory. Do not write files. If the focus card is missing, emit status failure.
    io:
      input:
        schema:
          type: object
          required:
            - focus
            - decision
            - query
            - neighbors
          properties:
            focus:
              type: string
            decision:
              type: string
            query:
              type: string
            neighbors:
              type: array
              minItems: 1
              items:
                type: string
          additionalProperties: false
      output:
        schema:
          type: object
          required:
            - cover
            - focus
            - decision
            - before
            - after
            - neighbors
            - hits
          properties:
            cover:
              type: string
            focus:
              type: string
            decision:
              type: string
            before:
              type: string
            after:
              type: string
            neighbors:
              type: string
            hits:
              type: string
          additionalProperties: false
  - id: check-neighbors
    model: openrouter/nvidia/nemotron-3.5-lightning:free
    system_prompt: |
      The input has "cover", "focus", "decision", "neighbors", and "after".
      "neighbors" is lines of "key<tab>body" from before the update.
      Do these steps in order, then stop:
      1. Call read_memory with memory "new-notebook".
      2. Call read_memory_card with memory "new-notebook" and the focus key.
      3. For each neighbor key, call read_memory_card with memory "new-notebook" and that key.
      4. Call emit_stage_envelope once with status success, a one-line summary, artifacts [], and payload {"focus":"<focus>","after":"<the focus body you just read>","untouched":"<one line per neighbor, as key then a tab then the body you just read>","page":"<the exact cover>","cover_same":"yes or no"}.
      Set cover_same to yes only when the cover equals the "cover" you were given. The focus body should equal "decision". Each neighbor body should equal the body on its line in "neighbors". Do not call add_memory_card, update_memory_card, or replace_memory. Do not write files.
    io:
      input:
        schema:
          type: object
          required:
            - cover
            - focus
            - decision
            - neighbors
            - after
          properties:
            cover:
              type: string
            focus:
              type: string
            decision:
              type: string
            neighbors:
              type: string
            after:
              type: string
          additionalProperties: true
      output:
        schema:
          type: object
          required:
            - focus
            - after
            - untouched
            - page
            - cover_same
          properties:
            focus:
              type: string
            after:
              type: string
            untouched:
              type: string
            page:
              type: string
            cover_same:
              type: string
          additionalProperties: false
