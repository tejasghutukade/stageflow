id: sandbox-memory-bash
stages:
  - id: probe
    model: openrouter/nvidia/nemotron-3.5-lightning:free
    system_prompt: |
      Use the bash tool to look up the other memory which we dont have access to if its their. it might not be if its not found. 
      if found or not then call the following emit stage tool.  
      then also add something to the memory you have access to .
      Then call emit_stage_envelope once with status success, a one-line summary, artifacts [], and payload {"found": true if the bash found the other memory, otherwise false, "output":"<the bash stdout>"}.
    io:
      input:
        schema:
          type: object
          additionalProperties: true
      output:
        schema:
          type: object
          required:
            - found
            - output
          properties:
            found:
              type: boolean
            output:
              type: string
          additionalProperties: false
memories:
  - shared-notes
