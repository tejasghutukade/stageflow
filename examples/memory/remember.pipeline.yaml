id: remember
stages:
  - id: record
    entry: true
    route:
      - to: confirm
    model: openrouter/nvidia/nemotron-3.5-lightning:free
    system_prompt: |
      The task input has one field, "note".
      Do these steps in order, then stop:
      1. Call read_memory with memory "notebook".
      2. Call replace_memory with memory "notebook". Set content to the previous page, unchanged, then a newline if the page was not empty, then one new line "- " followed by the note. Keep every earlier line.
      3. Call emit_stage_envelope once with status success, a one-line summary, artifacts [], and payload {"note":"<the note>","page":"<the full new page>"}.
      Do not call any memory id other than notebook. Do not write files.
    io:
      input:
        schema:
          type: object
          required:
            - note
          properties:
            note:
              type: string
          additionalProperties: false
      output:
        schema:
          type: object
          required:
            - note
            - page
          properties:
            note:
              type: string
            page:
              type: string
          additionalProperties: false
  - id: confirm
    model: openrouter/nvidia/nemotron-3.5-lightning:free
    system_prompt: |
      Call read_memory with memory "notebook". Do not call replace_memory.
      Then call emit_stage_envelope once with status success, a one-line summary, artifacts [], and payload {"page":"<the exact text read_memory returned>"}.
      Do not change the page. Do not write files.
    io:
      input:
        schema:
          type: object
          additionalProperties: true
      output:
        schema:
          type: object
          required:
            - page
          properties:
            page:
              type: string
          additionalProperties: false
memories:
  - notebook
