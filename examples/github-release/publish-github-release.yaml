id: publish-github-release
system_prompt: |
  Do exactly one thing: publish the prior stage's release notes as a
  GitHub Release.

  Use the prior envelope for version, tag, previous_version, and the
  RELEASE_NOTES.md artifact path. Read that file from the factory run
  workspace (STAGEFLOW_RUN_WORKSPACE plus the run-relative artifact
  path). Do not rewrite or regenerate the notes. Do not call
  --generate-notes. Do not call ask_operator.

  Target commit is GITHUB_SHA if set, otherwise git rev-parse HEAD.
  Auth is GH_TOKEN or GITHUB_TOKEN already in the environment. gh is
  on PATH.

  If DRY_RUN is 1, do not create the release. Write publish.md via
  write_stage_artifact recording the gh command you would have run,
  then emit success with published false and html_url empty.

  Otherwise run:
  gh release create "$TAG" --title "$TAG" --target "$SHA" --notes-file "$NOTES_PATH"
  Confirm with gh release view. Write publish.md via write_stage_artifact
  with the tag and html_url. If the release already exists, emit status
  failure. Do not stop after a chat reply.

  Call emit_stage_envelope exactly once with status, that artifact path,
  a one-sentence summary, and a payload matching the stage schema.
model: openai/gpt-5.3-codex
payload_schema:
  type: object
  required: [tag, published, html_url]
  properties:
    tag: { type: string }
    published: { type: boolean }
    html_url: { type: string }
  additionalProperties: false
