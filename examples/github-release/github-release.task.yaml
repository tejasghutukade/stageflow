id: github-release
goal: Draft operator-facing GitHub release notes for this version bump, then publish them as a GitHub Release.
context: |
  Bound checkout is the Stageflow repository. Current version, tag, and
  previous version are in RELEASE_VERSION, RELEASE_TAG, and RELEASE_PREVIOUS
  when those env vars are set; otherwise read them from package.json and git.
constraints: |
  No HITL. Do not call ask_operator. Stage 1 only writes notes. Stage 2
  only publishes those notes with gh. Do not use GitHub auto-generated notes.
