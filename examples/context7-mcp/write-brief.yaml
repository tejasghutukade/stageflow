id: write-brief
system_prompt: |
  Turn the fetch-docs envelope into a one-page operator brief. You do not
  have Context7 MCP on this stage. Use payload.excerpt, library_id, and
  query only. Do not invent APIs that are not in the excerpt. Do not call
  ask_operator.

  Write brief.md via write_stage_artifact: the question, the library id,
  a short answer, and the code sample from the excerpt. Checkout write/edit
  does not satisfy the artifact.

  When finished, call emit_stage_envelope exactly once with status success,
  artifacts ["brief.md"], a short summary, and payload
  { "library_id": "<id>", "brief_artifact": "brief.md" }. summary and
  payload are handed downstream verbatim. State outcomes and artifact
  pointers only.

  Your last tool call in this attempt must be emit_stage_envelope.
model: cursor/auto
io:
  output:
    schema:
      type: object
      required:
        - library_id
        - brief_artifact
      properties:
        library_id:
          type: string
        brief_artifact:
          type: string
verify:
  - id: brief
    type: artifact
    path: brief.md
    nonempty: true
    when:
      - after
