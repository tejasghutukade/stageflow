id: playwright-mcp
goal: Open https://google.com and take a screenshot of that page as a PNG artifact.
context: One-stage Playwright MCP walkthrough. Playwright must save page.png under this attempt's artifacts directory (absolute path in the stage prompt), not the repo root.
