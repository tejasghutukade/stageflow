id: route-demo-reject-if-clonable
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: severity
          op: eq
          value: high
    system_prompt: Triage.
    model: cursor/auto
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity]
          properties:
            severity:
              type: string
  - id: page
    clonable: true
    route:
      - to: collect
    system_prompt: Page.
    model: cursor/auto
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: collect
    system_prompt: Collect.
    model: cursor/auto
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
