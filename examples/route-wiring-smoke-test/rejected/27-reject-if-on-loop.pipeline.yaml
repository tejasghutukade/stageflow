id: route-demo-reject-if-on-loop
stages:
  - id: plan
    entry: true
    route:
      - to: implement
    system_prompt: Plan.
    model: cursor/auto
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: implement
    route:
      - to: review
    system_prompt: Implement.
    model: cursor/auto
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: review
    route:
      - to: submit
      - type: loop
        to: implement
        max_replays: 2
        on_max_replays: require_continue
        replay_session: resume
        if:
          field: verdict
          op: eq
          value: pass
    system_prompt: Review.
    model: cursor/auto
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [verdict]
          properties:
            verdict:
              type: string
  - id: submit
    replay_safe: false
    system_prompt: Submit.
    model: cursor/auto
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
