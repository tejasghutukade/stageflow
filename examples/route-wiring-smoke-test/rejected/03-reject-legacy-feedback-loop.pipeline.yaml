id: route-demo-reject-feedback-loop
stages:
  - id: implement
    entry: true
    route:
      - to: review
    system_prompt: Implement.
    model: anthropic/claude-haiku-5-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: review
    feedback_loop:
      target: implement
      max_replays: 2
      on_max_replays: require_continue
      replay_session: resume
    system_prompt: Review.
    model: anthropic/claude-haiku-5-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
