id: route-demo-reject-closed-io
stages:
  - id: draft
    entry: true
    route:
      - to: review
    system_prompt: Draft.
    model: anthropic/claude-haiku-5-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [title]
          properties:
            title:
              type: string
            extra:
              type: string
  - id: review
    system_prompt: Review.
    model: anthropic/claude-haiku-5-5
    io:
      input:
        schema:
          type: object
          additionalProperties: false
          required: [title]
          properties:
            title:
              type: string
      output:
        schema:
          type: object
