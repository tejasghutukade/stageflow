id: route-demo-reject-if-unknown-field
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: unknown_field
          op: eq
          value: high
    system_prompt: Triage.
    model: anthropic/claude-haiku-4-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity]
          properties:
            severity:
              type: string
  - id: page
    system_prompt: Page.
    model: anthropic/claude-haiku-4-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
