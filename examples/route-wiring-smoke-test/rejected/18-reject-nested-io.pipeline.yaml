id: route-demo-reject-nested-io
stages:
  - id: draft
    entry: true
    route:
      - to: review
    system_prompt: Draft.
    model: anthropic/claude-haiku-5-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [title, metadata]
          properties:
            title:
              type: string
            metadata:
              type: object
              required: [source]
              properties:
                source:
                  type: string
  - id: review
    system_prompt: Review.
    model: anthropic/claude-haiku-5-5
    io:
      input:
        schema:
          type: object
          required: [title, metadata]
          properties:
            title:
              type: string
            metadata:
              type: object
              required: [source, owner]
              properties:
                source:
                  type: string
                owner:
                  type: object
                  required: [email]
                  properties:
                    email:
                      type: string
      output:
        schema:
          type: object
