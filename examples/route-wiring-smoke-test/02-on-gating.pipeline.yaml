id: route-demo-on-gate
stages:
  - id: run-tests
    entry: true
    route:
      - to: ship
        on: [succeeded]
      - to: hotfix
        on: [failed]
    system_prompt: Run the test suite.
    model: anthropic/claude-sonnet-4-5
  - id: ship
    system_prompt: Ship the release.
    model: anthropic/claude-sonnet-4-5
  - id: hotfix
    system_prompt: Apply a hotfix.
    model: anthropic/claude-sonnet-4-5
