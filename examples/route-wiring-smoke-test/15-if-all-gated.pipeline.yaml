id: route-demo-if-all-gated
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: severity
          op: eq
          value: high
    system_prompt: |
      Triage in one sentence.
      Then emit a success envelope via emit_stage_envelope with status: success, a short summary, artifacts: [], and payload: {"severity": "low"}.
    model: anthropic/claude-haiku-4-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity]
          properties:
            severity:
              type: string
  - id: page
    system_prompt: |
      Page on-call in one sentence.
      Then emit a success envelope via emit_stage_envelope with status: success, a short summary, artifacts: [], and payload: {}.
    model: anthropic/claude-haiku-4-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
