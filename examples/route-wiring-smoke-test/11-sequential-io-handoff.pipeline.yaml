id: route-demo-sequential-io
stages:
  - id: draft
    entry: true
    route:
      - to: review
    system_prompt: |
      Draft a titled document in one sentence.
      Then emit a success envelope via emit_stage_envelope with status: success, a short summary, artifacts: [], and payload: {"title": "Smoke draft"}.
    model: anthropic/claude-haiku-4-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [title]
          properties:
            title:
              type: string
  - id: review
    system_prompt: |
      Review the titled document in one sentence.
      Then emit a success envelope via emit_stage_envelope with status: success, a short summary, artifacts: [], and payload: {}.
    model: anthropic/claude-haiku-4-5
    io:
      input:
        schema:
          type: object
          required: [title]
          properties:
            title:
              type: string
      output:
        schema:
          type: object
