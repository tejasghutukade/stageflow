id: route-demo-fan-out-fan-in
# AND-split / AND-join: unconditional parallel fan-out (no route_select --
# kickoff's route lists ALL three targets, so ALL three always run) feeding
# one join that waits for ALL of them to genuinely succeed. This is the
# "true AND" pattern -- distinct from 05-fork-choice's "OR" pattern
# (route_select picks one-or-a-subset, the rest are skipped) and from
# 01-core-routing's close (also an AND-join, but most of its parents
# resolve "skipped" rather than actually running).
stages:
  - id: kickoff
    entry: true
    route:
      - to: research
      - to: analysis
      - to: review-notes
    system_prompt: Kick off three independent workstreams in parallel.
    model: cursor/auto

  - id: research
    route:
      - to: synthesize
    system_prompt: Workstream 1 (research). Produce one short finding.
    model: cursor/auto

  - id: analysis
    route:
      - to: synthesize
    system_prompt: Workstream 2 (analysis). Produce one short finding.
    model: cursor/auto

  - id: review-notes
    route:
      - to: synthesize
    system_prompt: Workstream 3 (review notes). Produce one short finding.
    model: cursor/auto

  # AND-join: waits for research, analysis, AND review-notes -- all three,
  # every time, since none of them are ever skipped (kickoff has no
  # route_select, so nothing here is optional).
  - id: synthesize
    system_prompt: Combine all three workstreams' findings into one summary.
    model: cursor/auto
