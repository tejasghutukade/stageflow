id: diamond-fan-in-clone
stages:
  - id: clarify
    entry: true
    route:
      - to: research
      - to: validation
    uses: ../stages/clarify.yaml
  - id: research
    clonable: true
    clone_cap: 5
    route:
      - to: synthesize
        on: [succeeded, skipped]
    uses: ../stages/research.yaml
  - id: validation
    route:
      - to: synthesize
    uses: ../stages/validation.yaml
  - id: synthesize
    uses: ../stages/synthesize.yaml
