id: clonable-nested-gate
stages:
  - id: detect-changes
    entry: true
    route:
      - to: author-diagrams
    system_prompt: Detect changes.
    model: anthropic/claude-sonnet-4-5
  - id: author-diagrams
    clonable: true
    clone_cap: 5
    route:
      - to: collect
    system_prompt: Author diagrams.
    model: anthropic/claude-sonnet-4-5
  - id: collect
    system_prompt: Collect results.
    model: anthropic/claude-sonnet-4-5
