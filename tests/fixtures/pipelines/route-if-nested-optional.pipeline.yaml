id: route-if-nested-optional
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: customer.tier
          op: eq
          value: gold
    system_prompt: Triage the payload.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [customer]
          properties:
            customer:
              type: object
              properties:
                tier:
                  type: string
  - id: page
    system_prompt: Page on-call.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
