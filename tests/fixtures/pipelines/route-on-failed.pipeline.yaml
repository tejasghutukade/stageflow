id: route-on-failed
stages:
  - id: run-tests
    entry: true
    route:
      - to: ship
        on: [succeeded]
      - to: hotfix
        on: [failed]
    system_prompt: Run tests.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: ship
    system_prompt: Ship the release.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: hotfix
    system_prompt: Apply a hotfix.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
