id: route-loop-non-ancestor
stages:
  - id: plan
    entry: true
    route:
      - to: implement
      - to: sibling
    system_prompt: Create the plan.
    model: test/model
  - id: implement
    route:
      - type: loop
        to: sibling
        max_replays: 1
        on_max_replays: require_continue
        replay_session: resume
    system_prompt: Implement the approved plan.
    model: test/model
  - id: sibling
    system_prompt: An unrelated sibling stage, not an ancestor of implement.
    model: test/model
