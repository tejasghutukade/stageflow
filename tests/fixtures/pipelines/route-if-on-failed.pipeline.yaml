id: route-if-on-failed
stages:
  - id: run-tests
    entry: true
    route:
      - to: ship
        on: [succeeded]
      - to: hotfix
        on: [failed]
        if:
          field: severity
          op: eq
          value: high
    system_prompt: Run tests.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity]
          properties:
            severity:
              type: string
  - id: ship
    system_prompt: Ship the release.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: hotfix
    system_prompt: Apply a hotfix.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
