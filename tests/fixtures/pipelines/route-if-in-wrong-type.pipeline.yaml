id: route-if-in-wrong-type
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: severity
          op: in
          value: [1, 2]
    system_prompt: Triage the payload.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity]
          properties:
            severity:
              type: string
  - id: page
    system_prompt: Page on-call.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
