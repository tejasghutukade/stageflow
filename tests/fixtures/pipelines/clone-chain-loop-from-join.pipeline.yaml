id: clone-chain-loop-from-join
schemas:
  Issue:
    type: object
    required: [id, title]
    properties:
      id:
        type: string
      title:
        type: string
stages:
  - id: prepare
    entry: true
    route:
      - to: emit-items
    system_prompt: Prepare the list work.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: emit-items
    clone_cap: 4
    clone_mode: parallel
    route:
      - to: handle-item
    system_prompt: Emit a list of issues.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/schemas/Issue"
            summary:
              type: string
  - id: handle-item
    route:
      - to: gather
    system_prompt: Handle one issue.
    model: test/model
    io:
      input:
        schema:
          $ref: "#/schemas/Issue"
      output:
        schema:
          type: object
          required: [id]
          properties:
            id:
              type: string
  - id: gather
    route:
      - to: done
      - type: loop
        to: prepare
        max_replays: 2
        on_max_replays: require_continue
        replay_session: resume
    system_prompt: Gather clone results.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: done
    replay_safe: false
    system_prompt: Finish after gather continues.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
