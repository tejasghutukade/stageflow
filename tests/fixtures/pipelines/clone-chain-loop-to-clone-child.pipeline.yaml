id: clone-chain-loop-to-clone-child
schemas:
  Issue:
    type: object
    required: [id]
    properties:
      id:
        type: string
stages:
  - id: prepare
    entry: true
    route:
      - to: emit-items
    system_prompt: Prepare.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: emit-items
    clone_cap: 4
    clone_mode: parallel
    route:
      - to: handle-item
    system_prompt: Emit items.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/schemas/Issue"
  - id: handle-item
    route:
      - to: gather
    system_prompt: Handle one.
    model: test/model
    io:
      input:
        schema:
          $ref: "#/schemas/Issue"
      output:
        schema:
          type: object
  - id: gather
    route:
      - type: loop
        to: handle-item
        max_replays: 2
        on_max_replays: require_continue
        replay_session: resume
    system_prompt: Gather.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
