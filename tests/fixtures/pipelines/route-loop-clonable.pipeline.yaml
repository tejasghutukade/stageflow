id: route-loop-clonable
stages:
  - id: prepare
    entry: true
    route:
      - to: implement
    system_prompt: Prepare the work.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: implement
    clonable: true
    route:
      - to: review
    system_prompt: Implement the approved plan.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: review
    route:
      - type: loop
        to: implement
        max_replays: 2
        on_max_replays: require_continue
        replay_session: resume
    system_prompt: Review the work and explicitly continue or send it back.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
