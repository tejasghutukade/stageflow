id: home-path-checkout-env
stages:
  - id: home-path-ok
    entry: true
    system_prompt: |
      Work under $STAGEFLOW_CHECKOUT. Do not hardcode durable-home paths.
      Emit success when done.
    model: anthropic/claude-sonnet-4-5
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
    verify:
      - id: checkout-pkg
        type: command
        run: test -f "$STAGEFLOW_CHECKOUT/package.json"
