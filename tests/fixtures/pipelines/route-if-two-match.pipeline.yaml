id: route-if-two-match
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: severity
          op: eq
          value: high
      - to: notify
        if:
          field: escalate
          op: eq
          value: true
    system_prompt: Triage the payload.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity, escalate]
          properties:
            severity:
              type: string
            escalate:
              type: boolean
  - id: page
    system_prompt: Page on-call.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: notify
    system_prompt: Notify the team.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
