id: route-if-clonable-sibling
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: severity
          op: eq
          value: high
      - to: worker
    system_prompt: Triage the payload.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity]
          properties:
            severity:
              type: string
  - id: page
    system_prompt: Page on-call.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: worker
    clonable: true
    route:
      - to: collect
    system_prompt: Do cloned work.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: collect
    system_prompt: Collect results.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
