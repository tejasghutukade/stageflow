id: feedback-loop-clone-fanout
stages:
  - id: clarify
    uses: ../stages/clarify.yaml
  - id: design-doc
    needs: clarify
    clonable: true
    clone_cap: 5
    uses: ../stages/design-doc.yaml
  - id: join-doc
    needs: design-doc
    feedback_loop:
      target: clarify
      max_replays: 2
      on_max_replays: require_continue
      replay_session: resume
    system_prompt: Join clone outputs and continue or send back.
    model: test/model
  - id: submit
    needs: join-doc
    replay_safe: false
    system_prompt: Submit approved work.
    model: test/model
