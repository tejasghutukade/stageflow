id: route-if-gt-on-string
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: severity
          op: gt
          value: 1
    system_prompt: Triage the payload.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [severity]
          properties:
            severity:
              type: string
  - id: page
    system_prompt: Page on-call.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
