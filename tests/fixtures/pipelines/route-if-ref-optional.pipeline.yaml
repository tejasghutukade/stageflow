id: route-if-ref-optional
schemas:
  customer:
    type: object
    required: [tier]
    properties:
      tier:
        type: string
      note:
        type: string
stages:
  - id: triage
    entry: true
    route:
      - to: page
        if:
          field: customer.note
          op: eq
          value: vip
    system_prompt: Triage the payload.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [customer]
          properties:
            customer:
              $ref: "#/schemas/customer"
  - id: page
    system_prompt: Page on-call.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
