id: clone-chain-illegal-child-second-route
schemas:
  Issue:
    type: object
    required: [id]
    properties:
      id:
        type: string
stages:
  - id: emit-items
    entry: true
    clone_cap: 4
    clone_mode: parallel
    route:
      - to: handle-item
    system_prompt: Emit items.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/schemas/Issue"
  - id: handle-item
    route:
      - to: gather
      - to: sidecar
    system_prompt: Handle one.
    model: test/model
    io:
      input:
        schema:
          $ref: "#/schemas/Issue"
      output:
        schema:
          type: object
  - id: sidecar
    system_prompt: Sidecar.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: gather
    system_prompt: Gather.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
