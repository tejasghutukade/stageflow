id: route-loop-wait-human
stages:
  - id: plan
    entry: true
    route:
      - to: implement
    system_prompt: Create the plan.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: implement
    route:
      - to: review
    system_prompt: Implement the approved plan.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: review
    route:
      - to: submit
      - type: loop
        to: implement
        max_replays: 1
        on_max_replays: wait_for_human
        replay_session: resume
    system_prompt: Review the work and explicitly continue or send it back.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
  - id: submit
    replay_safe: false
    system_prompt: Submit approved work.
    model: test/model
    io:
      input:
        schema:
          type: object
      output:
        schema:
          type: object
