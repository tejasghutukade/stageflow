version: 1
public_url: https://agents.example.com
callers:
  - id: procurement
    token_env: PROCUREMENT_TOKEN
publications:
  - id: gated_capability
    name: Gated capability
    description: Requires operator approval before it can finish.
    project_root: .
    pipeline: gated.pipeline.yaml
    goal: Demonstrate that operator-only gates cannot be answered remotely.
    allowed_callers: [procurement]
    input_schema: gated.schema.json
    results:
      stage: approve
      include_payload: true
      artifacts: []
    caller_answerable_stages: []
